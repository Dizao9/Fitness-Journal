
services:
  db: 
    image: postgres:15-alpine
    container_name: fitness-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness_journal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrator:
    build: .
    restart: "no"
    command: ["/app/goose", "-dir", "/app/migrations", "postgres", "postgres://postgres:postgres@db:5432/fitness_journal?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness-app
    ports:
      - "8081:8081"
    environment:
      PORT: "8081"
      DSN: "postgres://postgres:postgres@db:5432/fitness_journal?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
volumes:
  pgdata:
  